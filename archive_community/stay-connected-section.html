<!-- Archived "Stay Connected" section (heading, email bar, social icons) from community.html -->

<style>
  .connect-section {
    max-width: 640px;
    margin: 0 auto;
    padding: 90px 24px 100px;
    text-align: center;
  }
  .connect-heading {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", sans-serif;
    font-size: 38px;
    font-weight: 500;
    color: #1a1a1a;
    margin: 0 0 32px;
  }
  .email-box {
    display: flex;
    align-items: stretch;
    max-width: 560px;
    margin: 0 auto;
  }
  .email-input {
    flex: 1;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", sans-serif;
    font-size: 16px;
    color: #1a1a1a;
    padding: 15px 22px;
    background: #f1f1f3;
    border: 1px solid #e6e6e9;
    border-right: none;
    border-radius: 16px 0 0 16px;
    outline: none;
  }
  .email-input::placeholder {
    color: #9a9aa2;
  }
  .email-input:focus {
    border-color: #d8d8de;
    background: #ececef;
  }
  .email-submit {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 58px;
    color: #ffffff;
    background: linear-gradient(135deg, #6b9eff, #2161e6);
    border: none;
    border-radius: 0 16px 16px 0;
    cursor: pointer;
  }
  .email-submit:hover {
    background: linear-gradient(135deg, #7fabff, #3a75ea);
  }
  .email-submit svg {
    width: 20px;
    height: 20px;
  }
  .social-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 20px;
    margin-top: 40px;
  }
  .social-icon {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 44px;
    height: 44px;
    border-radius: 50%;
    background: #f4f6f8;
    color: #1a1a1a;
    transition: background 0.15s ease, transform 0.15s ease;
  }
  .social-icon:hover {
    background: #e7ebef;
    transform: translateY(-2px);
  }
  .social-icon svg {
    width: 20px;
    height: 20px;
  }
</style>
