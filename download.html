<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Download</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@400;500;600;700&family=Fira+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700,900&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    /* Neutral ramp — the whole palette. No hue anywhere. */
    --ink:        #0b0b0d;   /* headlines, primary text */
    --ink-2:      #6e6e73;   /* secondary text */
    --ink-3:      #a1a1a6;   /* tertiary, placeholders */
    --line:       #e0e0e3;   /* hairlines */
    --surface:    #f5f5f7;   /* raised panels */
    --bg:         #ffffff;

    /* Smoked glass — liquid glass read for a white page. A faint graphite
       pane instead of a white one (white on white doesn't register), a
       hairline dark rim, and a bright inner lip where light catches. */
    --glass-fill:       rgba(11, 11, 13, 0.05);
    --glass-fill-hover: rgba(11, 11, 13, 0.08);
    --glass-rim:        rgba(11, 11, 13, 0.10);
    --glass-rim-hover:  rgba(11, 11, 13, 0.17);
    --glass-blur:       blur(18px) saturate(140%);
    --glass-lip:        inset 0 1px 0 rgba(255, 255, 255, 0.95);
    --glass-lift:       0 1px 2px rgba(11, 11, 13, 0.04),
                        0 5px 14px rgba(11, 11, 13, 0.05);
    --glass-lift-hover: 0 2px 4px rgba(11, 11, 13, 0.07),
                        0 14px 34px rgba(11, 11, 13, 0.11);

    /* Same construction at full density, for controls that carry a page. */
    --ink-glass:        rgba(11, 11, 13, 0.90);
    --ink-glass-hover:  rgba(11, 11, 13, 0.97);
  }
  html { height: 100%; }
  body {
    background: var(--bg);
    font-family: "Work Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  .topbar {
    position: sticky;
    top: 0;
    z-index: 50;
    height: 70px;
    width: 100%;
    background: rgba(255, 255, 255, 0.72);
    backdrop-filter: saturate(180%) blur(20px);
    -webkit-backdrop-filter: saturate(180%) blur(20px);
    border-bottom: 1px solid var(--line);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 30px;
  }
  .nav-group-left {
    display: flex;
    align-items: center;
    gap: 50px;
  }
  .logo-spot {
    width: auto;
    height: 100%;
    display: flex;
    align-items: center;
  }
  .logo-link {
    display: flex;
    align-items: center;
    text-decoration: none;
  }
  .logo-text {
    font-family: "Satoshi", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    font-size: 24px;
    font-weight: 600;
    letter-spacing: -0.01em;
    color: var(--ink);
  }
  .nav-left {
    display: flex;
    align-items: center;
    gap: 35px;
    position: relative;
  }
  .nav-dropdown {
    position: relative;
    display: inline-flex;
    align-items: center;
  }
  .nav-caret {
    display: inline-block;
    width: 0;
    height: 0;
    margin-left: 7px;
    border-left: 4px solid transparent;
    border-right: 4px solid transparent;
    border-top: 5px solid currentColor;
    opacity: 0.85;
    transition: transform 0.2s ease;
  }
  .nav-dropdown:hover .nav-caret,
  .nav-dropdown:focus-within .nav-caret {
    transform: rotate(180deg);
  }
  .nav-menu {
    position: absolute;
    top: 100%;
    left: -14px;
    min-width: 170px;
    padding: 8px;
    margin-top: 10px;
    background: rgba(255, 255, 255, 0.86);
    backdrop-filter: saturate(180%) blur(20px);
    -webkit-backdrop-filter: saturate(180%) blur(20px);
    border: 1px solid var(--glass-rim);
    border-radius: 12px;
    box-shadow: var(--glass-lift);
    opacity: 0;
    visibility: hidden;
    transform: translateY(-6px);
    transition: opacity 0.18s ease, transform 0.18s ease, visibility 0.18s;
    z-index: 60;
  }
  /* bridges the gap so the menu doesn't close while moving the cursor to it */
  .nav-dropdown::after {
    content: "";
    position: absolute;
    top: 100%;
    left: 0;
    right: 0;
    height: 14px;
  }
  .nav-dropdown:hover .nav-menu,
  .nav-dropdown:focus-within .nav-menu {
    opacity: 1;
    visibility: visible;
    transform: translateY(0);
  }
  .nav-menu a {
    display: block;
    padding: 9px 14px;
    border-radius: 8px;
    font-family: "Fira Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    font-size: 16px;
    font-weight: 400;
    color: var(--ink);
    text-decoration: none;
    white-space: nowrap;
  }
  .nav-menu a:hover {
    background: var(--surface);
  }
  .nav-indicator {
    position: absolute;
    bottom: 0;
    left: 0;
    width: 0;
    height: 2px;
    background: var(--ink);
    border-radius: 2px;
    pointer-events: none;
    transition: left 0.28s cubic-bezier(0.4, 0, 0.2, 1), width 0.28s cubic-bezier(0.4, 0, 0.2, 1);
  }
  .nav-link {
    font-family: "Fira Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    font-size: 17px;
    font-weight: 400;
    color: var(--ink-2);
    text-decoration: none;
    padding: 10px 0;
    transition: color 0.2s ease;
  }
  .nav-link:hover {
    color: var(--ink);
  }
  .nav-link.active {
    color: var(--ink);
    font-weight: 600;
  }
  .nav-right {
    display: flex;
    align-items: center;
  }
  /* same liquid-glass treatment as the hero CTA, scaled down */
  .download-link {
    position: relative;
    isolation: isolate;
    overflow: hidden;
    display: inline-block;
    font-family: "Fira Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    font-size: 15px;
    font-weight: 500;
    color: var(--ink);
    text-decoration: none;
    padding: 9px 22px;
    border-radius: 999px;
    /* lens gradient over the graphite wash — brighter at the top where the
       light lands, settling into the tint at the bottom */
    background:
      linear-gradient(168deg,
        rgba(255, 255, 255, 0.72) 0%,
        rgba(255, 255, 255, 0.18) 46%,
        rgba(255, 255, 255, 0) 62%),
      var(--glass-fill);
    backdrop-filter: blur(14px) saturate(200%) brightness(1.05);
    -webkit-backdrop-filter: blur(14px) saturate(200%) brightness(1.05);
    border: 1px solid var(--glass-rim);
    box-shadow:
      0 1px 1px rgba(11, 11, 13, 0.03),
      0 2px 6px rgba(11, 11, 13, 0.035),
      inset 0 1px 0 rgba(255, 255, 255, 1),
      inset 0 -2px 3px -2px rgba(11, 11, 13, 0.13),
      inset 0 0 14px rgba(255, 255, 255, 0.55);
    transition: transform 0.5s cubic-bezier(0.34, 1.7, 0.5, 1),
                background 0.35s ease,
                box-shadow 0.35s ease,
                border-color 0.35s ease;
  }
  /* specular streak — parked off the left edge, sweeps across on hover */
  .download-link::before {
    content: "";
    position: absolute;
    inset: -1px;
    border-radius: inherit;
    background: linear-gradient(102deg,
      rgba(255, 255, 255, 0) 34%,
      rgba(255, 255, 255, 0.95) 50%,
      rgba(255, 255, 255, 0) 66%);
    transform: translateX(-130%);
    opacity: 0;
    pointer-events: none;
    z-index: -1;
    transition: transform 0.8s cubic-bezier(0.22, 0.61, 0.36, 1),
                opacity 0.3s ease;
  }
  /* the rounded edge of the glass: light catches the top-left, the
     bottom-right falls into shadow, so the pill reads as a solid object */
  .download-link::after {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: inherit;
    padding: 1px;
    background: linear-gradient(150deg,
      rgba(255, 255, 255, 1) 0%,
      rgba(255, 255, 255, 0.15) 38%,
      rgba(11, 11, 13, 0.07) 66%,
      rgba(11, 11, 13, 0.15) 100%);
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite: xor;
    mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    mask-composite: exclude;
    pointer-events: none;
    z-index: -1;
    transition: opacity 0.35s ease;
    opacity: 0.9;
  }
  .download-link:hover {
    transform: translateY(-2px) scale(1.04);
    border-color: var(--glass-rim-hover);
    backdrop-filter: blur(18px) saturate(220%) brightness(1.08);
    -webkit-backdrop-filter: blur(18px) saturate(220%) brightness(1.08);
    box-shadow:
      0 1px 2px rgba(11, 11, 13, 0.04),
      0 5px 12px rgba(11, 11, 13, 0.06),
      inset 0 1px 0 rgba(255, 255, 255, 1),
      inset 0 -2px 4px -2px rgba(11, 11, 13, 0.16),
      inset 0 0 18px rgba(255, 255, 255, 0.7);
  }
  .download-link:hover::before {
    transform: translateX(130%);
    opacity: 1;
  }
  .download-link:hover::after {
    opacity: 1;
  }
  /* press squishes the glass, then it springs back */
  .download-link:active {
    transform: translateY(0) scale(0.95);
    transition: transform 0.11s ease-out;
  }
  @media (prefers-reduced-motion: reduce) {
    .download-link {
      transition: background 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
    }
    .download-link::before {
      display: none;
    }
    .download-link:hover,
    .download-link:active {
      transform: none;
    }
  }

</style>
</head>
<body>
  <div class="topbar">
    <div class="nav-group-left">
      <div class="logo-spot"><a href="index.html" class="logo-link"><span class="logo-text">Étude</span></a></div>
      <div class="nav-left">
      <span class="nav-dropdown"><a href="resources.html" class="nav-link ">Resources<span class="nav-caret"></span></a><div class="nav-menu"><a href="resources.html">Docs</a><a href="#">Blog</a></div></span>
      <a href="models.html" class="nav-link ">Models</a>
      <a href="community.html" class="nav-link ">Community</a>
      </div>
    </div>
    <div class="nav-right">
      <a href="download.html" class="download-link active">Download</a>
    </div>
  </div>

  <script>
    (function() {
      var navLeft = document.querySelector('.nav-left');
      if (!navLeft) return;
      var links = navLeft.querySelectorAll('.nav-link');
      var indicator = document.createElement('div');
      indicator.className = 'nav-indicator';
      navLeft.appendChild(indicator);

      function moveIndicatorTo(el) {
        if (!el) {
          indicator.style.width = '0';
          return;
        }
        // Measured against .nav-left rather than offsetLeft, since the
        // Resources dropdown wrapper is itself positioned and would
        // otherwise become the offset parent.
        var navRect = navLeft.getBoundingClientRect();
        var rect = el.getBoundingClientRect();
        indicator.style.left = (rect.left - navRect.left) + 'px';
        indicator.style.width = rect.width + 'px';
      }

      var activeLink = navLeft.querySelector('.nav-link.active');
      moveIndicatorTo(activeLink);

      links.forEach(function(link) {
        link.addEventListener('mouseenter', function() {
          moveIndicatorTo(link);
        });
      });
      navLeft.addEventListener('mouseleave', function() {
        moveIndicatorTo(activeLink);
      });
      window.addEventListener('resize', function() {
        moveIndicatorTo(activeLink);
      });
    })();
  </script>

</body>
</html>
