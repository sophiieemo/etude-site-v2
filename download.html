<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Download</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@400;500;600;700&family=Fira+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700,900&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    /* Neutral ramp — the whole palette. No hue anywhere. */
    --ink:        #0b0b0d;   /* headlines, primary text */
    --ink-2:      #6e6e73;   /* secondary text */
    --ink-3:      #a1a1a6;   /* tertiary, placeholders */
    --line:       #e0e0e3;   /* hairlines */
    --surface:    #f5f5f7;   /* raised panels */
    --bg:         #ffffff;

    /* Smoked glass — liquid glass read for a white page. A faint graphite
       pane instead of a white one (white on white doesn't register), a
       hairline dark rim, and a bright inner lip where light catches. */
    --glass-fill:       rgba(11, 11, 13, 0.05);
    --glass-fill-hover: rgba(11, 11, 13, 0.08);
    --glass-rim:        rgba(11, 11, 13, 0.10);
    --glass-rim-hover:  rgba(11, 11, 13, 0.17);
    --glass-blur:       blur(18px) saturate(140%);
    --glass-lip:        inset 0 1px 0 rgba(255, 255, 255, 0.95);
    --glass-lift:       0 1px 2px rgba(11, 11, 13, 0.04),
                        0 5px 14px rgba(11, 11, 13, 0.05);
    --glass-lift-hover: 0 2px 4px rgba(11, 11, 13, 0.07),
                        0 14px 34px rgba(11, 11, 13, 0.11);

    /* Same construction at full density, for controls that carry a page. */
    --ink-glass:        rgba(11, 11, 13, 0.90);
    --ink-glass-hover:  rgba(11, 11, 13, 0.97);
    --ink-glass-fg:     #ffffff;   /* text on the inked pane */

    /* The one hue on the site: the community network's response to the
       cursor, and the music notes round the hero. Kept as an R,G,B triplet
       so alpha can be varied at the point of use. */
    --net:              74, 144, 217;

    /* Values the pages used to hardcode. They live here so the dark theme
       below can reach them without every rule being duplicated. */
    --topbar-bg:        rgba(255, 255, 255, 0.72);
    --topbar-blur:      saturate(180%) blur(20px);
    --menu-bg:          rgba(255, 255, 255, 0.86);
    --pane:             rgba(255, 255, 255, 0.28);  /* free-floating glass */
    --pane-hover:       rgba(255, 255, 255, 0.46);
    --sheen:            rgba(255, 255, 255, 0.5);   /* top of a lens gradient */
    --sheen-soft:       rgba(255, 255, 255, 0.12);
    --lip:              rgba(255, 255, 255, 0.95);
    --dot:              rgba(11, 11, 13, 0.34);   /* resources track */
  }
  html { height: 100%; }
  body {
    color: var(--ink);
    background: var(--bg);
    font-family: "Work Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }

  /* ---- dark theme ---------------------------------------------------------
     Same token names, flipped. Set with data-theme="dark" on <html>, so a
     rule only needs its own entry here if it hardcoded a light value. */
  :root[data-theme="dark"] {
    --ink:        #f2f2f4;
    --ink-2:      rgba(255, 255, 255, 0.62);
    --ink-3:      rgba(255, 255, 255, 0.40);
    --line:       rgba(255, 255, 255, 0.13);
    --surface:    #141416;
    --bg:         #0a0a0c;

    /* the pane goes pale instead of graphite — dark on dark doesn't
       register — and the lip pulls right back, since a full white edge
       reads as chrome rather than caught light */
    --glass-fill:       rgba(255, 255, 255, 0.07);
    --glass-fill-hover: rgba(255, 255, 255, 0.13);
    --glass-rim:        rgba(255, 255, 255, 0.16);
    --glass-rim-hover:  rgba(255, 255, 255, 0.30);
    --glass-lip:        inset 0 1px 0 rgba(255, 255, 255, 0.22);
    --glass-lift:       0 1px 2px rgba(0, 0, 0, 0.5),
                        0 5px 14px rgba(0, 0, 0, 0.4);
    --glass-lift-hover: 0 2px 4px rgba(0, 0, 0, 0.55),
                        0 14px 34px rgba(0, 0, 0, 0.45);

    /* the high-density pane inverts to white with dark text */
    --ink-glass:        rgba(255, 255, 255, 0.92);
    --ink-glass-hover:  #ffffff;
    --ink-glass-fg:     #0b0b0d;

    --topbar-bg:        rgba(255, 255, 255, 0.055);
    --topbar-blur:      saturate(150%) blur(20px);
    --menu-bg:          rgba(20, 20, 22, 0.9);
    --pane:             rgba(255, 255, 255, 0.09);
    --pane-hover:       rgba(255, 255, 255, 0.16);
    --sheen:            rgba(255, 255, 255, 0.22);
    --sheen-soft:       rgba(255, 255, 255, 0.06);
    --lip:              rgba(255, 255, 255, 0.24);

    --dot:              rgba(255, 255, 255, 0.30);

    --net:              125, 180, 240;
  }
  :root[data-theme="dark"] body { color-scheme: dark; }

  /* The inked pill is built from white highlights on a near-black pane. In
     dark mode the pane is white, so those highlights have nothing to do and
     the shading has to come from the other side. */
  :root[data-theme="dark"] .download-link {
    border-color: rgba(11, 11, 13, 0.18);
    box-shadow:
      0 1px 1px rgba(0, 0, 0, 0.5),
      0 2px 7px rgba(0, 0, 0, 0.45),
      inset 0 1px 0 rgba(255, 255, 255, 0.9),
      inset 0 -2px 3px -2px rgba(11, 11, 13, 0.3),
      inset 0 0 14px rgba(11, 11, 13, 0.05);
  }
  :root[data-theme="dark"] .download-link::before {
    background: linear-gradient(102deg,
      rgba(11, 11, 13, 0) 26%,
      rgba(11, 11, 13, 0.16) 50%,
      rgba(11, 11, 13, 0) 74%);
  }
  :root[data-theme="dark"] .download-link::after {
    background: linear-gradient(150deg,
      rgba(255, 255, 255, 0.9) 0%,
      rgba(255, 255, 255, 0.2) 38%,
      rgba(11, 11, 13, 0.08) 66%,
      rgba(11, 11, 13, 0.18) 100%);
  }

  /* ---- the toggle --------------------------------------------------------- */
  .theme-toggle {
    position: fixed;
    right: 22px;
    bottom: 22px;
    z-index: 90;
    width: 44px;
    height: 44px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    color: var(--ink);
    background:
      linear-gradient(165deg, var(--sheen) 0%, var(--sheen-soft) 42%,
                      rgba(255, 255, 255, 0) 60%),
      var(--pane);
    backdrop-filter: blur(16px) saturate(190%);
    -webkit-backdrop-filter: blur(16px) saturate(190%);
    border: 1px solid var(--glass-rim);
    box-shadow: var(--glass-lift), inset 0 1px 0 var(--lip);
    transition: background 0.25s ease, border-color 0.25s ease,
                box-shadow 0.25s ease,
                transform 0.5s cubic-bezier(0.34, 1.7, 0.5, 1);
  }
  .theme-toggle:hover {
    background:
      linear-gradient(165deg, var(--sheen) 0%, var(--sheen-soft) 42%,
                      rgba(255, 255, 255, 0) 60%),
      var(--pane-hover);
    border-color: var(--glass-rim-hover);
    box-shadow: var(--glass-lift-hover), inset 0 1px 0 var(--lip);
    transform: translateY(-2px);
  }
  .theme-toggle:active { transform: scale(0.94); transition: transform 0.11s ease-out; }
  .theme-toggle svg { width: 19px; height: 19px; display: block; }
  /* one icon per theme — the other is hidden */
  .theme-toggle .icon-moon { display: none; }
  :root[data-theme="dark"] .theme-toggle .icon-sun { display: none; }
  :root[data-theme="dark"] .theme-toggle .icon-moon { display: block; }
  @media (prefers-reduced-motion: reduce) {
    .theme-toggle:hover, .theme-toggle:active { transform: none; }
  }

  .topbar {
    position: sticky;
    top: 0;
    z-index: 50;
    height: 70px;
    width: 100%;
    background: var(--topbar-bg);
    backdrop-filter: var(--topbar-blur);
    -webkit-backdrop-filter: var(--topbar-blur);
    border-bottom: 1px solid var(--line);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 30px;
  }
  .nav-group-left {
    display: flex;
    align-items: center;
    gap: 50px;
  }
  .logo-spot {
    width: auto;
    height: 100%;
    display: flex;
    align-items: center;
  }
  .logo-link {
    display: flex;
    align-items: center;
    text-decoration: none;
  }
  .logo-text {
    font-family: "Satoshi", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    font-size: 24px;
    font-weight: 600;
    letter-spacing: -0.01em;
    color: var(--ink);
  }
  .nav-left {
    display: flex;
    align-items: center;
    gap: 35px;
    position: relative;
  }
  .nav-dropdown {
    position: relative;
    display: inline-flex;
    align-items: center;
  }
  .nav-caret {
    display: inline-block;
    width: 0;
    height: 0;
    margin-left: 7px;
    border-left: 4px solid transparent;
    border-right: 4px solid transparent;
    border-top: 5px solid currentColor;
    opacity: 0.85;
    transition: transform 0.2s ease;
  }
  .nav-dropdown:hover .nav-caret,
  .nav-dropdown:focus-within .nav-caret {
    transform: rotate(180deg);
  }
  .nav-menu {
    position: absolute;
    top: 100%;
    left: -14px;
    min-width: 170px;
    padding: 8px;
    margin-top: 10px;
    background: var(--menu-bg);
    backdrop-filter: saturate(180%) blur(20px);
    -webkit-backdrop-filter: saturate(180%) blur(20px);
    border: 1px solid var(--glass-rim);
    border-radius: 12px;
    box-shadow: var(--glass-lift);
    opacity: 0;
    visibility: hidden;
    transform: translateY(-6px);
    transition: opacity 0.18s ease, transform 0.18s ease, visibility 0.18s;
    z-index: 60;
  }
  /* bridges the gap so the menu doesn't close while moving the cursor to it */
  .nav-dropdown::after {
    content: "";
    position: absolute;
    top: 100%;
    left: 0;
    right: 0;
    height: 14px;
  }
  .nav-dropdown:hover .nav-menu,
  .nav-dropdown:focus-within .nav-menu {
    opacity: 1;
    visibility: visible;
    transform: translateY(0);
  }
  .nav-menu a {
    display: block;
    padding: 9px 14px;
    border-radius: 8px;
    font-family: "Fira Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    font-size: 16px;
    font-weight: 400;
    color: var(--ink);
    text-decoration: none;
    white-space: nowrap;
  }
  .nav-menu a:hover {
    background: var(--surface);
  }
  .nav-indicator {
    position: absolute;
    bottom: 0;
    left: 0;
    width: 0;
    height: 2px;
    background: var(--ink);
    border-radius: 2px;
    pointer-events: none;
    transition: left 0.28s cubic-bezier(0.4, 0, 0.2, 1), width 0.28s cubic-bezier(0.4, 0, 0.2, 1);
  }
  .nav-link {
    font-family: "Fira Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    font-size: 17px;
    font-weight: 400;
    color: var(--ink-2);
    text-decoration: none;
    padding: 10px 0;
    transition: color 0.2s ease;
  }
  .nav-link:hover {
    color: var(--ink);
  }
  .nav-link.active {
    color: var(--ink);
    font-weight: 600;
  }
  .nav-right {
    display: flex;
    align-items: center;
  }
  /* same liquid-glass treatment as the hero CTA, scaled down */
  .download-link {
    position: relative;
    isolation: isolate;
    overflow: hidden;
    display: inline-block;
    font-family: "Fira Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    font-size: 15px;
    font-weight: 500;
    color: var(--ink-glass-fg);
    text-decoration: none;
    padding: 9px 22px;
    border-radius: 999px;
    /* lens gradient over the inked pane — light gathers along the top and
       falls away into the tint, same as the pale version at a fraction of
       the strength, since white on near-black carries much further */
    background:
      linear-gradient(168deg,
        rgba(255, 255, 255, 0.22) 0%,
        rgba(255, 255, 255, 0.06) 46%,
        rgba(255, 255, 255, 0) 62%),
      var(--ink-glass);
    backdrop-filter: blur(14px) saturate(200%);
    -webkit-backdrop-filter: blur(14px) saturate(200%);
    border: 1px solid rgba(255, 255, 255, 0.16);
    box-shadow:
      0 1px 1px rgba(11, 11, 13, 0.10),
      0 2px 7px rgba(11, 11, 13, 0.12),
      inset 0 1px 0 rgba(255, 255, 255, 0.34),
      inset 0 -2px 3px -2px rgba(0, 0, 0, 0.5),
      inset 0 0 14px rgba(255, 255, 255, 0.06);
    transition: transform 0.5s cubic-bezier(0.34, 1.7, 0.5, 1),
                background 0.35s ease,
                box-shadow 0.35s ease,
                border-color 0.35s ease;
  }
  /* specular streak — parked off the left edge, sweeps across on hover */
  .download-link::before {
    content: "";
    position: absolute;
    inset: -1px;
    border-radius: inherit;
    background: linear-gradient(102deg,
      rgba(255, 255, 255, 0) 26%,
      rgba(255, 255, 255, 0.30) 50%,
      rgba(255, 255, 255, 0) 74%);
    transform: translateX(-130%);
    opacity: 0;
    pointer-events: none;
    z-index: -1;
    transition: transform 0.8s cubic-bezier(0.22, 0.61, 0.36, 1),
                opacity 0.3s ease;
  }
  /* the rounded edge of the glass: light catches the top-left, the
     bottom-right falls into shadow, so the pill reads as a solid object */
  .download-link::after {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: inherit;
    padding: 1px;
    background: linear-gradient(150deg,
      rgba(255, 255, 255, 0.5) 0%,
      rgba(255, 255, 255, 0.10) 38%,
      rgba(255, 255, 255, 0.05) 66%,
      rgba(255, 255, 255, 0.02) 100%);
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite: xor;
    mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    mask-composite: exclude;
    pointer-events: none;
    z-index: -1;
    transition: opacity 0.35s ease;
    opacity: 0.9;
  }
  .download-link:hover {
    transform: translateY(-2px) scale(1.04);
    border-color: rgba(255, 255, 255, 0.26);
    background:
      linear-gradient(168deg,
        rgba(255, 255, 255, 0.28) 0%,
        rgba(255, 255, 255, 0.08) 46%,
        rgba(255, 255, 255, 0) 62%),
      var(--ink-glass-hover);
    backdrop-filter: blur(18px) saturate(220%);
    -webkit-backdrop-filter: blur(18px) saturate(220%);
    box-shadow:
      0 1px 2px rgba(11, 11, 13, 0.12),
      0 6px 16px rgba(11, 11, 13, 0.16),
      inset 0 1px 0 rgba(255, 255, 255, 0.45),
      inset 0 -2px 4px -2px rgba(0, 0, 0, 0.55),
      inset 0 0 18px rgba(255, 255, 255, 0.09);
  }
  .download-link:hover::before {
    transform: translateX(130%);
    opacity: 1;
  }
  .download-link:hover::after {
    opacity: 1;
  }
  /* press squishes the glass, then it springs back */
  .download-link:active {
    transform: translateY(0) scale(0.95);
    transition: transform 0.11s ease-out;
  }
  @media (prefers-reduced-motion: reduce) {
    .download-link {
      transition: background 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
    }
    .download-link::before {
      display: none;
    }
    .download-link:hover,
    .download-link:active {
      transform: none;
    }
  }

</style>
  <script>
    // Runs before first paint so a dark-mode visitor never sees a white flash.
    (function() {
      try {
        var t = localStorage.getItem('etude-theme');
        if (!t) {
          t = window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark' : 'light';
        }
        document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <div class="topbar">
    <div class="nav-group-left">
      <div class="logo-spot"><a href="index.html" class="logo-link"><span class="logo-text">Étude</span></a></div>
      <div class="nav-left">
      <span class="nav-dropdown"><a href="resources.html" class="nav-link ">Resources<span class="nav-caret"></span></a><div class="nav-menu"><a href="resources.html">Docs</a><a href="#">Blog</a></div></span>
      <a href="models.html" class="nav-link ">Models</a>
      <a href="community.html" class="nav-link ">Community</a>
      </div>
    </div>
    <div class="nav-right">
      <a href="download.html" class="download-link active">Download</a>
    </div>
  </div>

  <script>
    (function() {
      var navLeft = document.querySelector('.nav-left');
      if (!navLeft) return;
      var links = navLeft.querySelectorAll('.nav-link');
      var indicator = document.createElement('div');
      indicator.className = 'nav-indicator';
      navLeft.appendChild(indicator);

      function moveIndicatorTo(el) {
        if (!el) {
          indicator.style.width = '0';
          return;
        }
        // Measured against .nav-left rather than offsetLeft, since the
        // Resources dropdown wrapper is itself positioned and would
        // otherwise become the offset parent.
        var navRect = navLeft.getBoundingClientRect();
        var rect = el.getBoundingClientRect();
        indicator.style.left = (rect.left - navRect.left) + 'px';
        indicator.style.width = rect.width + 'px';
      }

      var activeLink = navLeft.querySelector('.nav-link.active');
      moveIndicatorTo(activeLink);

      links.forEach(function(link) {
        link.addEventListener('mouseenter', function() {
          moveIndicatorTo(link);
        });
      });
      navLeft.addEventListener('mouseleave', function() {
        moveIndicatorTo(activeLink);
      });
      window.addEventListener('resize', function() {
        moveIndicatorTo(activeLink);
      });
    })();
  </script>

  <button class="theme-toggle" id="themeToggle" type="button"
          aria-label="Switch between light and dark" title="Light / dark">
    <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor"
         stroke-width="1.7" stroke-linecap="round">
      <circle cx="12" cy="12" r="4.2"></circle>
      <path d="M12 2.4v2.2M12 19.4v2.2M2.4 12h2.2M19.4 12h2.2M5.2 5.2l1.6 1.6M17.2 17.2l1.6 1.6M18.8 5.2l-1.6 1.6M6.8 17.2l-1.6 1.6"></path>
    </svg>
    <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
         stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
      <path d="M20 14.2A8.2 8.2 0 0 1 9.8 4a8.2 8.2 0 1 0 10.2 10.2z"></path>
    </svg>
  </button>

  <script>
    // ---- theme -------------------------------------------------------------
    // The stored choice is applied by an inline script in <head> so the page
    // never paints light and then flips. This half only wires the button.
    (function() {
      var btn = document.getElementById('themeToggle');
      if (!btn) return;
      btn.addEventListener('click', function() {
        var root = document.documentElement;
        var next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
        root.setAttribute('data-theme', next);
        try { localStorage.setItem('etude-theme', next); } catch (e) {}
        document.dispatchEvent(new CustomEvent('etude:theme', { detail: next }));
      });
    })();
  </script>

</body>
