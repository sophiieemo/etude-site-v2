<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Community</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@400;500;600;700&family=Inter:wght@400;500;600&family=Fira+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link href="https://api.fontshare.com/v2/css?f[]=general-sans@400,500,600,700&display=swap" rel="stylesheet">
<link href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700,900&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    /* Community runs inverted: black page, white marks. Same token names as
       the rest of the site with the ramp flipped, so every rule that reads
       from them follows without being rewritten. */
    --ink:        #ffffff;              /* headlines, primary text */
    --ink-2:      rgba(255,255,255,0.64); /* secondary text */
    --ink-3:      rgba(255,255,255,0.42); /* tertiary, placeholders */
    --line:       rgba(255,255,255,0.14); /* hairlines */
    --surface:    #151517;              /* raised panels */
    --bg:         #000000;

    /* Glass, inverted: a pale pane instead of a graphite one (black on black
       doesn't register), a light rim, and the lip pulled well back — a full
       white lip reads as a hard chrome edge on a dark page. */
    --glass-fill:       rgba(255, 255, 255, 0.08);
    --glass-fill-hover: rgba(255, 255, 255, 0.15);
    --glass-rim:        rgba(255, 255, 255, 0.22);
    --glass-rim-hover:  rgba(255, 255, 255, 0.38);
    --glass-blur:       blur(18px) saturate(140%);
    --glass-lip:        inset 0 1px 0 rgba(255, 255, 255, 0.30);
    --glass-lift:       0 1px 2px rgba(0, 0, 0, 0.55),
                        0 5px 14px rgba(0, 0, 0, 0.45);
    --glass-lift-hover: 0 2px 4px rgba(0, 0, 0, 0.6),
                        0 14px 34px rgba(0, 0, 0, 0.5);

    /* the high-density variant inverts to solid white with dark text */
    --ink-glass:        rgba(255, 255, 255, 0.92);
    --ink-glass-hover:  #ffffff;
  }
  html { height: 100%; }
  body {
    background: var(--bg);
    min-height: 100vh;
    font-family: "Work Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  .topbar {
    position: sticky;
    top: 0;
    z-index: 50;
    height: 70px;
    width: 100%;
    background: rgba(255, 255, 255, 0.055);
    backdrop-filter: saturate(150%) blur(20px);
    -webkit-backdrop-filter: saturate(150%) blur(20px);
    border-bottom: 1px solid var(--line);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 30px;
  }
  .nav-group-left {
    display: flex;
    align-items: center;
    gap: 50px;
  }
  .logo-spot {
    width: auto;
    height: 100%;
    display: flex;
    align-items: center;
  }
  .logo-link {
    display: flex;
    align-items: center;
    text-decoration: none;
  }
  .logo-text {
    font-family: "Satoshi", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    font-size: 24px;
    font-weight: 600;
    letter-spacing: -0.01em;
    color: var(--ink);
  }
  .nav-left {
    display: flex;
    align-items: center;
    gap: 35px;
    position: relative;
  }
  .nav-dropdown {
    position: relative;
    display: inline-flex;
    align-items: center;
  }
  .nav-caret {
    display: inline-block;
    width: 0;
    height: 0;
    margin-left: 7px;
    border-left: 4px solid transparent;
    border-right: 4px solid transparent;
    border-top: 5px solid currentColor;
    opacity: 0.85;
    transition: transform 0.2s ease;
  }
  .nav-dropdown:hover .nav-caret,
  .nav-dropdown:focus-within .nav-caret {
    transform: rotate(180deg);
  }
  .nav-menu {
    position: absolute;
    top: 100%;
    left: -14px;
    min-width: 170px;
    padding: 8px;
    margin-top: 10px;
    background: rgba(20, 20, 22, 0.88);
    backdrop-filter: saturate(180%) blur(20px);
    -webkit-backdrop-filter: saturate(180%) blur(20px);
    border: 1px solid var(--glass-rim);
    border-radius: 12px;
    box-shadow: var(--glass-lift);
    opacity: 0;
    visibility: hidden;
    transform: translateY(-6px);
    transition: opacity 0.18s ease, transform 0.18s ease, visibility 0.18s;
    z-index: 60;
  }
  /* bridges the gap so the menu doesn't close while moving the cursor to it */
  .nav-dropdown::after {
    content: "";
    position: absolute;
    top: 100%;
    left: 0;
    right: 0;
    height: 14px;
  }
  .nav-dropdown:hover .nav-menu,
  .nav-dropdown:focus-within .nav-menu {
    opacity: 1;
    visibility: visible;
    transform: translateY(0);
  }
  .nav-menu a {
    display: block;
    padding: 9px 14px;
    border-radius: 8px;
    font-family: "Fira Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    font-size: 16px;
    font-weight: 400;
    color: var(--ink);
    text-decoration: none;
    white-space: nowrap;
  }
  .nav-menu a:hover {
    background: var(--surface);
  }
  .nav-indicator {
    position: absolute;
    bottom: 0;
    left: 0;
    width: 0;
    height: 2px;
    background: var(--ink);
    border-radius: 2px;
    pointer-events: none;
    transition: left 0.28s cubic-bezier(0.4, 0, 0.2, 1), width 0.28s cubic-bezier(0.4, 0, 0.2, 1);
  }
  .nav-link {
    font-family: "Fira Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    font-size: 17px;
    font-weight: 400;
    color: var(--ink-2);
    text-decoration: none;
    padding: 10px 0;
    transition: color 0.2s ease;
  }
  .nav-link:hover {
    color: var(--ink);
  }
  .nav-link.active {
    color: var(--ink);
    font-weight: 500;
  }
  .nav-right {
    display: flex;
    align-items: center;
  }
  /* same liquid-glass treatment as the hero CTA, scaled down */
  .download-link {
    position: relative;
    isolation: isolate;
    overflow: hidden;
    display: inline-block;
    font-family: "Fira Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    font-size: 15px;
    font-weight: 500;
    color: var(--ink);
    text-decoration: none;
    padding: 9px 22px;
    border-radius: 999px;
    /* lens gradient over the graphite wash — brighter at the top where the
       light lands, settling into the tint at the bottom */
    background:
      linear-gradient(168deg,
        rgba(255, 255, 255, 0.26) 0%,
        rgba(255, 255, 255, 0.07) 46%,
        rgba(255, 255, 255, 0) 62%),
      var(--glass-fill);
    backdrop-filter: blur(14px) saturate(200%) brightness(1.05);
    -webkit-backdrop-filter: blur(14px) saturate(200%) brightness(1.05);
    border: 1px solid var(--glass-rim);
    box-shadow:
      0 1px 1px rgba(0, 0, 0, 0.4),
      0 2px 6px rgba(0, 0, 0, 0.35),
      inset 0 1px 0 rgba(255, 255, 255, 0.42),
      inset 0 -2px 3px -2px rgba(0, 0, 0, 0.5),
      inset 0 0 14px rgba(255, 255, 255, 0.09);
    transition: transform 0.5s cubic-bezier(0.34, 1.7, 0.5, 1),
                background 0.35s ease,
                box-shadow 0.35s ease,
                border-color 0.35s ease;
  }
  /* specular streak — parked off the left edge, sweeps across on hover */
  .download-link::before {
    content: "";
    position: absolute;
    inset: -1px;
    border-radius: inherit;
    background: linear-gradient(102deg,
      rgba(255, 255, 255, 0) 34%,
      rgba(255, 255, 255, 0.95) 50%,
      rgba(255, 255, 255, 0) 66%);
    transform: translateX(-130%);
    opacity: 0;
    pointer-events: none;
    z-index: -1;
    transition: transform 0.8s cubic-bezier(0.22, 0.61, 0.36, 1),
                opacity 0.3s ease;
  }
  /* the rounded edge of the glass: light catches the top-left, the
     bottom-right falls into shadow, so the pill reads as a solid object */
  .download-link::after {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: inherit;
    padding: 1px;
    background: linear-gradient(150deg,
      rgba(255, 255, 255, 0.75) 0%,
      rgba(255, 255, 255, 0.16) 38%,
      rgba(255, 255, 255, 0.05) 66%,
      rgba(255, 255, 255, 0.02) 100%);
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite: xor;
    mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    mask-composite: exclude;
    pointer-events: none;
    z-index: -1;
    transition: opacity 0.35s ease;
    opacity: 0.9;
  }
  .download-link:hover {
    transform: translateY(-2px) scale(1.04);
    border-color: var(--glass-rim-hover);
    backdrop-filter: blur(18px) saturate(220%) brightness(1.08);
    -webkit-backdrop-filter: blur(18px) saturate(220%) brightness(1.08);
    box-shadow:
      0 1px 2px rgba(0, 0, 0, 0.45),
      0 5px 12px rgba(0, 0, 0, 0.4),
      inset 0 1px 0 rgba(255, 255, 255, 0.55),
      inset 0 -2px 4px -2px rgba(0, 0, 0, 0.55),
      inset 0 0 18px rgba(255, 255, 255, 0.14);
  }
  .download-link:hover::before {
    transform: translateX(130%);
    opacity: 1;
  }
  .download-link:hover::after {
    opacity: 1;
  }
  /* press squishes the glass, then it springs back */
  .download-link:active {
    transform: translateY(0) scale(0.95);
    transition: transform 0.11s ease-out;
  }
  @media (prefers-reduced-motion: reduce) {
    .download-link {
      transition: background 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
    }
    .download-link::before {
      display: none;
    }
    .download-link:hover,
    .download-link:active {
      transform: none;
    }
  }

  #networkCanvas {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    display: block;
    z-index: 0;
  }
  .topbar {
    /* above the canvas, and still pinned */
    z-index: 20;
  }
  .community-block {
    position: relative;
    z-index: 2;
    padding: 165px 60px 0;
    max-width: 1120px;
    /* Nudged toward the middle without actually centring: 55% of the offset
       that would centre the block. Tracks the viewport, so it stays a nudge
       rather than a fixed indent on wide screens, and collapses to 0 once
       the block fills the width. */
    margin-left: clamp(0px, calc((100vw - 1120px) * 0.275), 240px);
  }
  .community-heading {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", sans-serif;
    font-size: 74px;
    font-weight: 500;
    line-height: 1.18;
    letter-spacing: -0.015em;
    color: var(--ink);
    margin: 0 0 72px;
  }
  .community-heading .word {
    display: inline-block;
    white-space: nowrap;
  }
  .community-heading .ch {
    display: inline-block;
    will-change: transform;
  }
  .social-tabs {
    display: flex;
    justify-content: flex-start;
    gap: 22px;
  }
  .social-tab {
    position: relative;
    overflow: hidden;
    isolation: isolate;
    display: flex;
    align-items: center;
    gap: 13px;
    padding: 19px 38px;
    border-radius: 999px;
    background: var(--glass-fill);
    border: 1px solid var(--glass-rim);
    color: var(--ink);
    text-decoration: none;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", sans-serif;
    font-size: 20px;
    font-weight: 500;
    box-shadow: var(--glass-lift), var(--glass-lip);
    backdrop-filter: var(--glass-blur);
    -webkit-backdrop-filter: var(--glass-blur);
    transition: background 0.32s ease, transform 0.32s cubic-bezier(0.22, 0.61, 0.36, 1),
                box-shadow 0.32s ease, backdrop-filter 0.32s ease;
  }

  /* soft specular sheen that sweeps across on hover */
  .social-tab::before {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: inherit;
    /* a wide, soft pass of light rather than a hard streak — the 0.95 peak
       was set for a white page, where the sheen had to fight a pale pane */
    background: linear-gradient(105deg,
      rgba(255, 255, 255, 0) 18%,
      rgba(255, 255, 255, 0.24) 50%,
      rgba(255, 255, 255, 0) 82%);
    transform: translateX(-120%);
    opacity: 0;
    transition: transform 0.95s cubic-bezier(0.3, 0.5, 0.3, 1), opacity 0.4s ease;
    pointer-events: none;
    z-index: -1;
  }

  /* faint iridescent rim, like light refracting through glass */
  .social-tab::after {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: inherit;
    padding: 1px;
    background: linear-gradient(120deg,
      rgba(255, 255, 255, 0.85),
      rgba(255, 255, 255, 0.18) 35%,
      rgba(255, 255, 255, 0.7) 65%,
      rgba(255, 255, 255, 0.22));
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite: xor;
    mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    mask-composite: exclude;
    opacity: 0;
    transition: opacity 0.32s ease;
    pointer-events: none;
    z-index: -1;
  }

  .social-tab:hover {
    background: var(--glass-fill-hover);
    border-color: var(--glass-rim-hover);
    transform: translateY(-3px) scale(1.035);
    box-shadow: var(--glass-lift-hover), var(--glass-lip);
  }
  .social-tab:hover::before {
    transform: translateX(120%);
    opacity: 1;
  }
  .social-tab:hover::after {
    opacity: 1;
  }
  .social-tab:active {
    transform: translateY(-1px) scale(1.01);
  }
  .social-tab svg {
    width: 24px;
    height: 24px;
  }

</style>

  <script>
    (function() {
      var navLeft = document.querySelector('.nav-left');
      if (!navLeft) return;
      var links = navLeft.querySelectorAll('.nav-link');
      var indicator = document.createElement('div');
      indicator.className = 'nav-indicator';
      navLeft.appendChild(indicator);

      function moveIndicatorTo(el) {
        if (!el) {
          indicator.style.width = '0';
          return;
        }
        // Measured against .nav-left rather than offsetLeft, since the
        // Resources dropdown wrapper is itself positioned and would
        // otherwise become the offset parent.
        var navRect = navLeft.getBoundingClientRect();
        var rect = el.getBoundingClientRect();
        indicator.style.left = (rect.left - navRect.left) + 'px';
        indicator.style.width = rect.width + 'px';
      }

      var activeLink = navLeft.querySelector('.nav-link.active');
      moveIndicatorTo(activeLink);

      links.forEach(function(link) {
        link.addEventListener('mouseenter', function() {
          moveIndicatorTo(link);
        });
      });
      navLeft.addEventListener('mouseleave', function() {
        moveIndicatorTo(activeLink);
      });
      window.addEventListener('resize', function() {
        moveIndicatorTo(activeLink);
      });
    })();
  </script>


  <script>
    (function() {
      var canvas = document.getElementById('networkCanvas');
      if (!canvas || !canvas.getContext) return;
      var ctx = canvas.getContext('2d');

      var SPACING = 46;      // grid spacing between dots
      var REACH = 190;       // how far the cursor's web extends
      var dots = [];
      var dpr = window.devicePixelRatio || 1;
      var mouse = { x: -9999, y: -9999, active: false };

      function viewport() {
        var w = window.innerWidth || document.documentElement.clientWidth || 1200;
        var h = window.innerHeight || document.documentElement.clientHeight || 800;
        return { w: w, h: h };
      }

      function build() {
        var vp = viewport(); var w = vp.w, h = vp.h;
        canvas.width = w * dpr;
        canvas.height = h * dpr;
        canvas.style.width = w + 'px';
        canvas.style.height = h + 'px';
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

        dots = [];
        var cols = Math.ceil(w / SPACING) + 1;
        var rows = Math.ceil(h / SPACING) + 1;
        var offX = (w - (cols - 1) * SPACING) / 2;
        var offY = (h - (rows - 1) * SPACING) / 2;
        for (var r = 0; r < rows; r++) {
          for (var c = 0; c < cols; c++) {
            dots.push({
              x: offX + c * SPACING,
              y: offY + r * SPACING,
              glow: 0
            });
          }
        }
      }

      var lastW = 0, lastH = 0;
      function rebuildIfResized() {
        var vp = viewport();
        if (vp.w === lastW && vp.h === lastH) return;
        lastW = vp.w; lastH = vp.h;
        build();
      }
      rebuildIfResized();
      window.addEventListener('resize', rebuildIfResized);

      window.addEventListener('mousemove', function(e) {
        mouse.x = e.clientX; mouse.y = e.clientY; mouse.active = true;
      });
      window.addEventListener('mouseleave', function() { mouse.active = false; });
      window.addEventListener('touchmove', function(e) {
        if (!e.touches.length) return;
        mouse.x = e.touches[0].clientX;
        mouse.y = e.touches[0].clientY;
        mouse.active = true;
      }, { passive: true });
      window.addEventListener('touchend', function() { mouse.active = false; });

      // When the cursor is over the headline, soften the whole effect so the
      // words stay legible instead of competing with the web behind them.
      var headline = document.querySelector('.community-heading');
      var damp = 1;              // 1 = full strength, lower = more diffused
      var DAMP_MIN = 0.44;       // how much web survives over the headline

      function targetDamp() {
        if (!headline || !mouse.active) return 1;
        var r = headline.getBoundingClientRect();
        var pad = 24;
        var inside = mouse.x >= r.left - pad && mouse.x <= r.right + pad &&
                     mouse.y >= r.top - pad && mouse.y <= r.bottom + pad;
        return inside ? DAMP_MIN : 1;
      }

      function frame() {
        var vp = viewport(); var w = vp.w, h = vp.h;
        ctx.clearRect(0, 0, w, h);

        // ease toward the target so it softens/returns gradually
        damp += (targetDamp() - damp) * 0.14;

        // 1) connecting lines from the cursor out to nearby dots
        if (mouse.active) {
          for (var i = 0; i < dots.length; i++) {
            var d = dots[i];
            var dx = d.x - mouse.x, dy = d.y - mouse.y;
            var dist = Math.sqrt(dx * dx + dy * dy);
            if (dist < REACH) {
              var t = 1 - dist / REACH;          // 1 at cursor, 0 at edge
              // Squared falloff rather than a clamped linear one: the old
              // curve sat at full strength across the inner third of the
              // reach, which is what made the web read as drawn spokes.
              var fade = Math.pow(t, 1.15);
              var peak = fade * 0.40 * damp;
              // Each line also fades along its own length — brightest where
              // it leaves the cursor, almost gone by the time it reaches the
              // dot — so the whole thing reads as haze rather than lines.
              var lineGrad = ctx.createLinearGradient(mouse.x, mouse.y, d.x, d.y);
              lineGrad.addColorStop(0,    'rgba(255,255,255,' + peak.toFixed(3) + ')');
              lineGrad.addColorStop(0.5,  'rgba(255,255,255,' + (peak * 0.46).toFixed(3) + ')');
              lineGrad.addColorStop(1,    'rgba(255,255,255,' + (peak * 0.14).toFixed(3) + ')');
              ctx.beginPath();
              ctx.moveTo(mouse.x, mouse.y);
              ctx.lineTo(d.x, d.y);
              ctx.strokeStyle = lineGrad;
              ctx.lineWidth = (0.55 + t * 0.45) * (0.45 + damp * 0.55);
              ctx.stroke();
            }
          }
        }

        // 2) the dots themselves, brightening near the cursor
        for (var j = 0; j < dots.length; j++) {
          var p = dots[j];
          var target = 0;
          if (mouse.active) {
            var ax = p.x - mouse.x, ay = p.y - mouse.y;
            var dd = Math.sqrt(ax * ax + ay * ay);
            if (dd < REACH) target = 1 - dd / REACH;
          }
          p.glow += (target - p.glow) * 0.55;   // snappier, less smoothed reaction

          var g = p.glow * damp;                // damped highlight
          var size = 1.5 + g * 3.4;
          var alpha = 0.26 * (0.5 + damp * 0.5) + g * 0.72;
          ctx.beginPath();
          ctx.arc(p.x, p.y, size, 0, Math.PI * 2);
          ctx.fillStyle = 'rgba(255,255,255,' + alpha.toFixed(3) + ')';
          ctx.fill();
        }

        // 3) the cursor point — a crisp hub normally, blooming into a soft
        //    glowing orb as the web dims over the headline text
        if (mouse.active) {
          // normalised against DAMP_MIN so the orb still reaches full
          // strength over the text however far the web is damped
          var bloom = (1 - damp) / (1 - DAMP_MIN);
          if (bloom > 1) bloom = 1;
          if (bloom < 0) bloom = 0;

          if (bloom > 0.01) {
            var orbR = 14 + bloom * 62;         // grows as it takes over
            var grad = ctx.createRadialGradient(
              mouse.x, mouse.y, 0,
              mouse.x, mouse.y, orbR
            );
            grad.addColorStop(0,    'rgba(255,255,255,' + (0.38 * bloom).toFixed(3) + ')');
            grad.addColorStop(0.25, 'rgba(255,255,255,' + (0.19 * bloom).toFixed(3) + ')');
            grad.addColorStop(0.6,  'rgba(255,255,255,' + (0.07 * bloom).toFixed(3) + ')');
            grad.addColorStop(1,    'rgba(255,255,255,0)');
            ctx.beginPath();
            ctx.arc(mouse.x, mouse.y, orbR, 0, Math.PI * 2);
            ctx.fillStyle = grad;
            ctx.fill();
          }

          // small solid core, brightest when the web is at full strength
          ctx.beginPath();
          ctx.arc(mouse.x, mouse.y, 6 * (0.5 + damp * 0.5), 0, Math.PI * 2);
          ctx.fillStyle = 'rgba(255,255,255,' + (0.4 + 0.5 * damp).toFixed(3) + ')';
          ctx.fill();
        }

        requestAnimationFrame(frame);
      }

      frame();
    })();
  </script>

  <script>
    (function() {
      var heading = document.querySelector('.community-heading');
      if (!heading) return;

      // Split the headline into per-letter spans (spaces stay as real spaces
      // so the text still wraps naturally).
      var text = heading.textContent;
      heading.textContent = '';
      var letters = [];
      var words = text.split(' ');
      for (var w = 0; w < words.length; w++) {
        // Each word is one unbreakable box, so lines never split mid-word.
        var wordEl = document.createElement('span');
        wordEl.className = 'word';
        for (var i = 0; i < words[w].length; i++) {
          var span = document.createElement('span');
          span.className = 'ch';
          span.textContent = words[w][i];
          wordEl.appendChild(span);
          letters.push({ el: span, bx: 0, by: 0, ox: 0, oy: 0, os: 0 });
        }
        heading.appendChild(wordEl);
        if (w < words.length - 1) {
          heading.appendChild(document.createTextNode(' '));
        }
      }

      var REACH = 130;   // how close the cursor must be to nudge a letter
      var mx = -9999, my = -9999, active = false;

      function measure() {
        for (var i = 0; i < letters.length; i++) {
          var L = letters[i];
          L.el.style.transform = 'none';
        }
        for (var j = 0; j < letters.length; j++) {
          var M = letters[j];
          var r = M.el.getBoundingClientRect();
          M.bx = r.left + r.width / 2;
          M.by = r.top + r.height / 2;
        }
      }
      measure();
      window.addEventListener('resize', measure);
      window.addEventListener('scroll', measure, { passive: true });

      window.addEventListener('mousemove', function(e) {
        mx = e.clientX; my = e.clientY; active = true;
      });
      window.addEventListener('mouseleave', function() { active = false; });

      function tick() {
        for (var i = 0; i < letters.length; i++) {
          var L = letters[i];
          var tx = 0, ty = 0, ts = 0;

          if (active) {
            var dx = L.bx - mx, dy = L.by - my;
            var dist = Math.sqrt(dx * dx + dy * dy);
            if (dist < REACH) {
              var f = 1 - dist / REACH;        // 1 at cursor, 0 at edge
              var push = f * f * 6;            // subtler displacement
              if (dist > 0.001) {
                tx = (dx / dist) * push;
                ty = (dy / dist) * push - f * 3;   // slight lift as well
              }
              ts = f * 0.06;                   // very small scale-up
            }
          }

          // ease toward the target so letters settle rather than snap
          L.ox += (tx - L.ox) * 0.18;
          L.oy += (ty - L.oy) * 0.18;
          L.os += (ts - L.os) * 0.18;

          L.el.style.transform =
            'translate(' + L.ox.toFixed(2) + 'px,' + L.oy.toFixed(2) + 'px) scale(' +
            (1 + L.os).toFixed(3) + ')';
        }
        requestAnimationFrame(tick);
      }
      tick();
    })();
  </script>

</body>
</html>
